name: Perf

# Only when the measured code may have changed, plus a daily run on master
on:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "hooks/**"
      - "lib/**"
      - "e2e/**"
      - "package.json"
      - "bun.lock"
      - "next.config.ts"
      - "playwright.config.ts"
      - "perf-budget.json"
      - ".github/workflows/perf.yml"
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium

      # On a PR, the base branch is built and served on the same runner, so
      # compression times are compared on the same CPU
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.base_ref }}
          path: baseline
      - name: Serve baseline
        if: github.event_name == 'pull_request'
        run: |
          # Outside the workspace, so the PR's build doesn't type-check it
          mv baseline "$RUNNER_TEMP/baseline"
          cd "$RUNNER_TEMP/baseline"
          bun install --frozen-lockfile
          bun run build
          nohup bun run start --port 3211 > "$RUNNER_TEMP/baseline.log" 2>&1 &
          timeout 60 bash -c 'until curl -sf -o /dev/null http://localhost:3211; do sleep 1; done'
          echo "BASELINE_URL=http://localhost:3211" >> "$GITHUB_ENV"

      - name: Benchmark
        run: bun run test:perf
      - name: Summary
        if: always()
        run: |
          if [ -f perf-results.json ]; then
            {
              echo '### Mesures'
              echo '```json'
              cat perf-results.json
              echo '```'
              echo '### Budget'
              echo '```json'
              cat perf-budget.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-results
          path: |
            perf-results.json
            test-results/
          if-no-files-found: ignore
